[pytest]
# Three partitions:
#   default        : float32 solver + retrieval-stack suites (CI, every push)
#     pytest
#   float64 (slow) : tight-tolerance convergence/precision references
#     PYDISORT_RICCATI_JAX_X64=1 pytest -m float64
#   hpc            : production-scale gates in tests/hpc (cluster caches + hours;
#                    additionally opt-in via PYDISORT_HPC_GATES=1)
#     PYDISORT_HPC_GATES=1 python -m pytest tests/hpc -m hpc -v
#
# `addopts` excludes the opt-in partitions by default; an explicit `-m` on the
# command line overrides it (last -m wins).
addopts = -m "not float64 and not hpc"
norecursedirs = .ipynb_checkpoints __pycache__ reference_results
markers =
    float64: stringent convergence/precision test requiring float64 (run via `PYDISORT_RICCATI_JAX_X64=1 pytest -m float64`)
    hpc: production-scale HPC gate (cluster caches, hours; PYDISORT_HPC_GATES=1 + `-m hpc`)
