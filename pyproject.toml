[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydisort-riccati-jax"
version = "0.2.0"
description = "Differentiable (JAX) invariant-imbedding Riccati RT solver for inhomogeneous atmospheres, with the VOCALS r_e(tau) optimal-estimation retrieval stack."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dion J. X. Ho", email = "dh3065@columbia.edu" },
]
license = { text = "MIT" }
# PythonicDISORT is a hard dependency of the solver core (Gauss-Legendre and
# Legendre utilities from PythonicDISORT.subroutines), not just a test reference.
dependencies = [
  "numpy",
  "scipy",
  "jax",
  "diffrax",
  "PythonicDISORT",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=6.2.5"]
# The retrieval stack's extra I/O deps: vocals_io reads the VOCALS-REx netCDFs;
# optics_table builds its lookup table with miepython (loading a cached table
# needs neither).
retrieval = ["netCDF4", "miepython"]

[project.urls]
Homepage = "https://github.com/dhjx1996/Pythonic-DISORT_inhomogeneous_atmosphere"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydisort_riccati_jax = ["data/*.csv"]
